[project]
name = "placement-cell-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom.
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # sys.path setup must precede app imports.

# Pre-rewrite modules still backed by the in-memory store. Linting them now
# would mean fixing code that is about to be deleted, so they are exempt until
# the phase that rewrites them removes their entry here (mirrors the mypy
# override below). See docs/REWRITE_PLAN.md §7.
#
# Removed by Phase 1: api/deps.py, api/router.py, api/v1/auth.py, api/v1/common.py
"app/db/fake_db.py" = ["ALL"]
"app/api/v1/students.py" = ["ALL"]      # Phase 2
"app/api/v1/training.py" = ["ALL"]      # Phase 4
"app/api/v1/placements.py" = ["ALL"]    # Phase 5
"app/api/v1/events.py" = ["ALL"]        # Phase 6
"app/api/v1/analytics.py" = ["ALL"]     # Phase 7
"app/api/v1/communications.py" = ["ALL"]  # Phase 8
"app/schemas/training.py" = ["ALL"]     # Phase 4

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["alembic/versions/"]

# Strict where the domain logic lives. The rest of the tree is tightened as
# each phase rewrites it (docs/REWRITE_PLAN.md §8).
[[tool.mypy.overrides]]
module = ["app.services.*", "app.models.*", "app.core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true

# Pre-rewrite modules still backed by the in-memory store. Each is removed from
# this list by the phase that rewrites it.
# Removed by Phase 1: app.api.deps, app.api.router, app.api.v1.auth, app.api.v1.common
[[tool.mypy.overrides]]
module = [
    "app.db.fake_db",
    "app.api.v1.students",       # Phase 2
    "app.api.v1.training",       # Phase 4
    "app.api.v1.placements",     # Phase 5
    "app.api.v1.events",         # Phase 6
    "app.api.v1.analytics",      # Phase 7
    "app.api.v1.communications", # Phase 8
    "app.schemas.training",      # Phase 4
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/fake_db.py", "alembic/*"]
