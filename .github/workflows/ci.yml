name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Config has no defaults for these by design, so CI must supply them.
      SECRET_KEY: ci-secret-key-not-used-outside-ci
      DATABASE_URL: sqlite:///./ci.db
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        # --no-cache-dir: a stale wheel cache can serve a binary built for a
        # different interpreter (a cp312 pydantic-core under 3.14 fails at
        # import). Cheap insurance in CI.
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app scripts

      - name: Migrations apply cleanly from scratch
        run: python -m alembic upgrade head

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
